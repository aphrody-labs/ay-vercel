changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking
      labels:
        - breaking
    - title: Features
      labels:
        - feature
    - title: Fixes
      labels:
        - bug
        - security
    - title: Documentation
      labels:
        - docs
    - title: Maintenance
      labels:
        - chore
        - dependencies
        - github_actions
        - bun
        - rust
    - title: Other
      labels:
        - "*"
