# Declarative public-safe control plane for aphrody-labs/ay-vercel.
# Literal tokens, Team IDs, Project IDs, and OIDC secrets live ONLY in git-ignored `ay-vercel.local.toml`.

[product]
name = "ay-vercel"
repo = "aphrody-labs/ay-vercel"
fork_org = "aphrody-labs"
upstream_orgs = ["vercel", "vercel-labs"]
description = "Unified Vercel & Vercel-Labs monorepo, upstream fork auto-merge, agent skills, MCP catalog, offline docs, and polyglot toolchain"

[plans]
tier = "hobby"
fluid_compute = true
bun_runtime = true
agentic_infra = true

[finops]
# Vercel Hobby & Pro Fluid Compute baselines for cost estimation and budgeting
hobby_included_fast_data_transfer_gb = 100.0
hobby_included_edge_requests = 1_000_000
hobby_included_function_invocations = 1_000_000
hobby_included_active_cpu_hours = 4.0
hobby_included_provisioned_memory_gb_hours = 360.0
pro_base_seat_usd = 20.0
pro_included_fast_data_transfer_gb = 1000.0
pro_included_edge_requests = 10_000_000
pro_extra_data_transfer_per_gb_usd = 0.15
pro_extra_edge_requests_per_million_usd = 2.0
pro_active_cpu_per_hour_usd = 0.128
pro_provisioned_memory_per_gb_hour_usd = 0.0106
default_max_duration_seconds = 60
default_memory_mb = 1024

[team]
slug = "aphrody-dev"
default_node_version = "24.x"

[[project]]
name = "rg-website"
framework = "nextjs"
production_url = "https://rg-website-aphrody-dev.vercel.app"
node_version = "24.x"
fluid_compute = true

[[project]]
name = "rg-api"
framework = "nextjs"
production_url = "https://rg-api-pink.vercel.app"
node_version = "24.x"
fluid_compute = true

[[project]]
name = "rg-discord"
framework = "other"
node_version = "24.x"
fluid_compute = true

[sync]
schedule_cron = "17 4 * * *"
branch = "sync/upstreams-auto"
auto_merge = true
merge_method = "squash"
labels = ["upstream-sync", "auto-merge"]

[docs]
sitemap_url = "https://vercel.com/docs/sitemap"
taxonomy_url = "https://vercel.com/docs/taxonomy.json"
graph_url = "https://vercel.com/docs/graph.json"
local_dir = "docs/vercel"

[skills]
local_dir = "skills"
well_known_index = ".well-known/agent-skills/index.json"
registry_file = "skills/REGISTRY.json"
sources = [
  "vercel/vercel-plugin",
  "vercel-labs/agent-skills",
  "vercel-labs/skills",
  "vercel/vercel",
  "vercel/next.js",
