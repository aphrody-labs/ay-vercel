[workspace]
resolver = "3"
members = [
  "crates/*",
]
exclude = [
  "frameworks",
  "sdk",
  "skill-repos",
  "mcp",
  "docs",
  "agents",
  "ui",
  "runtime",
  "python",
  "templates",
]

[workspace.metadata]
name = "vercel-crates"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/ay-vercel"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(rust_analyzer)',
  'cfg(fuzzing)',
  'cfg(codspeed)',
  'cfg(debug_assert)',
] }

[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package.turbo-persistence]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

# Maximum AOT + Fat LTO release profile for crates.io-grade Rust + Bun binaries
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Cross-language LTO profile (rustc -Clinker-plugin-lto + clang -flto + lld)
[profile.release-xlto]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "unwind"

[patch.crates-io]
bincode = { git = "https://github.com/vercel-labs/bincode-fork.git", branch = "main" }
virtue = { git = "https://github.com/vercel-labs/virtue-fork.git", branch = "trunk" }
